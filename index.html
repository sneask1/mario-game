<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mario Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { 
    margin:0; 
    background:#5c94fc; 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    height:100vh; 
    font-family:sans-serif; 
    overflow:hidden;
    touch-action:none;
  }
  canvas { 
    background:#5c94fc; 
    border:4px solid #000; 
    max-width:100%; 
    touch-action:none;
  }
  
  #controls { 
    position:fixed; 
    bottom:20px; 
    left:0;
    right:0;
    display:flex; 
    justify-content:space-between; 
    align-items:flex-end;
    padding:0 15px; 
    pointer-events:none;
    z-index:50;
  }
  
  .btn { 
    width:80px; 
    height:80px; 
    background:rgba(255,255,255,0.3); 
    color:#fff; 
    border:3px solid rgba(255,255,255,0.7);
    border-radius:50%; 
    font-size:36px; 
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:auto;
    transition: background 0.05s, transform 0.05s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }
  
  .btn.active {
    background:rgba(229, 37, 33, 0.9);
    transform: scale(0.92);
  }
  
  .btn-jump {
    width:90px;
    height:90px;
    background:rgba(229, 37, 33, 0.6);
    font-size:40px;
  }
  
  .btn-jump.active {
    background:rgba(229, 37, 33, 1);
  }
  
  #pauseBtn {
    position:fixed;
    top:80px;
    right:15px;
    width:50px;
    height:50px;
    background:rgba(0,0,0,0.5);
    color:#fff;
    border:2px solid rgba(255,255,255,0.7);
    border-radius:50%;
    font-size:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:200;
  }
  
  #pauseBtn.active {
    background:rgba(229, 37, 33, 0.9);
  }
  
  #overlay { 
    position:fixed; 
    top:0; left:0; 
    width:100%; height:100%; 
    background:rgba(0,0,0,0.8); 
    display:none; 
    justify-content:center; 
    align-items:center; 
    flex-direction:column; 
    color:#fff; 
    text-align:center;
    z-index:100;
  }
  #overlay h1 { 
    font-size:48px; 
    margin:10px; 
    text-shadow:3px 3px 0 #000; 
  }
  #overlay p { 
    font-size:24px; 
    margin:10px; 
  }
  #restartBtn { 
    padding:15px 40px; 
    font-size:24px; 
    background:#e52521; 
    color:#fff; 
    border:none; 
    border-radius:10px; 
    margin-top:20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  #restartBtn:active {
    transform: scale(0.95);
  }
  
  #soundToggle {
    position:fixed;
    top:80px;
    left:15px;
    width:50px;
    height:50px;
    background:rgba(0,0,0,0.5);
    color:#fff;
    border:2px solid rgba(255,255,255,0.7);
    border-radius:50%;
    font-size:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:200;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="500"></canvas>

<div id="pauseBtn">⏸</div>
<div id="soundToggle">🔊</div>

<div id="controls">
  <button class="btn" id="left">◀</button>
  <button class="btn btn-jump" id="jump">▲</button>
  <button class="btn" id="right">▶</button>
</div>

<div id="overlay">
  <h1 id="overlayTitle">Game Over</h1>
  <p id="overlayText">Очки: 0</p>
  <button id="restartBtn">Играть снова</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const soundToggle = document.getElementById('soundToggle');

// ========== ЗВУКОВАЯ СИСТЕМА ==========
let audioCtx = null;
let soundEnabled = true;
let musicEnabled = true;
let musicInterval = null;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      console.log('Audio not supported');
    }
  }
}

// Активируем аудио при первом касании (требование браузеров)
function activateAudioOnInteraction() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Простой тон
function playTone(freq, duration, type = 'square', volume = 0.1) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// Звук прыжка (восходящий)
function playJumpSound() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch(e) {}
}

// Звук монетки (динь-динь)
function playCoinSound() {
  if (!soundEnabled || !audioCtx) return;
  playTone(988, 0.1, 'square', 0.08);
  setTimeout(() => playTone(1319, 0.15, 'square', 0.08), 80);
}

// Звук убийства врага
function playEnemyKillSound() {
  if (!soundEnabled || !audioCtx) return;
  playTone(400, 0.05, 'square', 0.1);
  setTimeout(() => playTone(600, 0.1, 'square', 0.1), 50);
}

// Звук получения урона
function playHurtSound() {
  if (!soundEnabled || !audioCtx) return;
  playTone(300, 0.1, 'sawtooth', 0.15);
  setTimeout(() => playTone(200, 0.15, 'sawtooth', 0.15), 100);
}

// Звук Game Over
function playGameOverSound() {
  if (!soundEnabled || !audioCtx) return;
  const notes = [523, 494, 440, 392, 349, 330, 294, 262];
  notes.forEach((freq, i) => {
    setTimeout(() => playTone(freq, 0.2, 'square', 0.12), i * 150);
  });
}

// Звук победы
function playWinSound() {
  if (!soundEnabled || !audioCtx) return;
  const notes = [523, 659, 784, 1047, 784, 1047];
  notes.forEach((freq, i) => {
    setTimeout(() => playTone(freq, 0.15, 'square', 0.12), i * 120);
  });
}

// Фоновая музыка (простая ретро-мелодия)
let musicNotes = [
  659, 659, 0, 659, 0, 523, 659, 0, 784, 0, 0, 0, 392, 0, 0, 0,
  523, 0, 0, 392, 0, 0, 330, 0, 0, 440, 0, 494, 0, 466, 440, 0,
  392, 659, 784, 880, 0, 698, 784, 0, 659, 0, 523, 587, 494, 0, 0, 0
];
let musicIndex = 0;

function startMusic() {
  if (!musicEnabled || !audioCtx) return;
  stopMusic();
  musicInterval = setInterval(() => {
    if (!musicEnabled || !audioCtx) {
      stopMusic();
      return;
    }
    const freq = musicNotes[musicIndex % musicNotes.length];
    if (freq > 0) {
      playTone(freq, 0.12, 'square', 0.04);
    }
    musicIndex++;
  }, 150);
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
}

// Переключатель звука
soundToggle.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  musicEnabled = soundEnabled;
  soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) {
    initAudio();
    startMusic();
  } else {
    stopMusic();
  }
});

// ========== ИГРОВЫЕ ПЕРЕМЕННЫЕ ==========
const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 500;

const keys = { left:false, right:false, jump:false };
let cameraX = 0;

let player = { x:50, y:300, w:30, h:40, vx:0, vy:0, onGround:false };

let score = 0;
let lives = 3;
let invincible = 0;
let gameOver = false;
let won = false;
let paused = false;

const platforms = [
  {x:0, y:460, w:450, h:40},
  {x:150, y:380, w:80, h:15},
  {x:280, y:320, w:80, h:15},
  {x:500, y:460, w:150, h:40},
  {x:550, y:360, w:80, h:15},
  {x:700, y:300, w:100, h:15},
  {x:820, y:380, w:80, h:15},
  {x:950, y:460, w:100, h:40},
  {x:1050, y:400, w:60, h:15},
  {x:1150, y:340, w:60, h:15},
  {x:1080, y:260, w:80, h:15},
  {x:1200, y:200, w:80, h:15},
  {x:1320, y:460, w:80, h:40},
  {x:1450, y:400, w:60, h:15},
  {x:1550, y:340, w:60, h:15},
  {x:1450, y:260, w:80, h:15},
  {x:1600, y:200, w:100, h:15},
  {x:1750, y:460, w:120, h:40},
  {x:1900, y:380, w:80, h:15},
  {x:2020, y:320, w:80, h:15},
  {x:1900, y:240, w:80, h:15},
  {x:2150, y:460, w:250, h:40},
  {x:2200, y:380, w:80, h:15},
  {x:2320, y:320, w:80, h:15},
];

let coins = [];
let enemies = [];

const flag = { x: 2350, y: 380, w: 10, h: 80 };

function initLevel() {
  coins = [
    {x:180, y:350, taken:false},
    {x:310, y:290, taken:false},
    {x:380, y:430, taken:false},
    {x:580, y:330, taken:false},
    {x:740, y:270, taken:false},
    {x:850, y:350, taken:false},
    {x:620, y:430, taken:false},
    {x:1080, y:370, taken:false},
    {x:1180, y:310, taken:false},
    {x:1110, y:230, taken:false},
    {x:1230, y:170, taken:false},
    {x:1480, y:370, taken:false},
    {x:1580, y:310, taken:false},
    {x:1480, y:230, taken:false},
    {x:1640, y:170, taken:false},
    {x:1360, y:430, taken:false},
    {x:1940, y:350, taken:false},
    {x:2050, y:290, taken:false},
    {x:1940, y:210, taken:false},
    {x:1800, y:430, taken:false},
    {x:2230, y:350, taken:false},
    {x:2350, y:290, taken:false},
    {x:2200, y:430, taken:false},
    {x:2280, y:430, taken:false},
    // Переместил последнюю монетку ПЕРЕД флагом
    {x:2320, y:430, taken:false},
  ];
  
  enemies = [
    {x:200, y:440, w:25, h:20, vx:1, minX:50, maxX:400, alive:true, type:'goomba'},
    {x:550, y:440, w:25, h:20, vx:-1, minX:500, maxX:625, alive:true, type:'goomba'},
    {x:970, y:440, w:25, h:20, vx:1, minX:950, maxX:1025, alive:true, type:'goomba'},
    {x:1340, y:440, w:25, h:20, vx:-1, minX:1320, maxX:1375, alive:true, type:'goomba'},
    {x:1780, y:440, w:25, h:20, vx:1, minX:1750, maxX:1845, alive:true, type:'goomba'},
    {x:2200, y:440, w:25, h:20, vx:-1, minX:2150, maxX:2375, alive:true, type:'goomba'},
    {x:750, y:200, w:25, h:20, vy:1, minY:150, maxY:280, alive:true, type:'flying'},
    {x:1500, y:150, w:25, h:20, vy:-1, minY:100, maxY:230, alive:true, type:'flying'},
  ];
}
initLevel();

function vibrate(style) {
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      if (style === 'light') window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      else if (style === 'heavy') window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
      else if (style === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      else if (style === 'error') window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
    } catch(e) {}
  }
}

function drawMario() {
  if (invincible > 0 && Math.floor(invincible / 5) % 2 === 0) return;
  const x = player.x - cameraX;
  const y = player.y;
  
  ctx.fillStyle = '#e52521';
  ctx.fillRect(x, y, player.w, 12);
  ctx.fillStyle = '#fcb89c';
  ctx.fillRect(x+5, y+12, 20, 12);
  ctx.fillStyle = '#1f5fd6';
  ctx.fillRect(x+3, y+24, 24, 16);
  ctx.fillStyle = '#000';
  ctx.fillRect(x+8, y+20, 14, 3);
}

function drawHearts() {
  for (let i = 0; i < 3; i++) {
    const x = 15 + i * 30;
    const y = 15;
    if (i < lives) {
      ctx.fillStyle = '#e52521';
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 6, 0, Math.PI * 2);
      ctx.arc(x + 15, y + 5, 6, 0, Math.PI * 2);
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 10, y + 20);
      ctx.lineTo(x + 20, y + 8);
      ctx.fill();
    } else {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 6, 0, Math.PI * 2);
      ctx.arc(x + 15, y + 5, 6, 0, Math.PI * 2);
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 10, y + 20);
      ctx.lineTo(x + 20, y + 8);
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('Очки: ' + score, 15, 55);
}

function drawPlatform(p) {
  const x = p.x - cameraX;
  if (x + p.w < 0 || x > canvas.width) return;
  
  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(x, p.y, p.w, p.h);
  ctx.fillStyle = '#fca044';
  ctx.fillRect(x, p.y, p.w, 4);
}

function drawCoin(c) {
  if (c.taken) return;
  const x = c.x - cameraX;
  if (x < -20 || x > canvas.width + 20) return;
  
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(x, c.y, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#b8860b';
  ctx.fillRect(x-1, c.y-5, 2, 10);
}

function drawEnemy(e) {
  if (!e.alive) return;
  const x = e.x - cameraX;
  if (x + e.w < 0 || x > canvas.width) return;
  
  if (e.type === 'goomba') {
    ctx.fillStyle = '#6b3410';
    ctx.fillRect(x, e.y, e.w, e.h);
    ctx.fillStyle = '#000';
    ctx.fillRect(x+5, e.y+5, 4, 4);
    ctx.fillRect(x+16, e.y+5, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(x+3, e.y+e.h-3, 6, 3);
    ctx.fillRect(x+16, e.y+e.h-3, 6, 3);
  } else if (e.type === 'flying') {
    ctx.fillStyle = '#8b3fc7';
    ctx.fillRect(x, e.y, e.w, e.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x-5, e.y+10);
    ctx.lineTo(x-12, e.y+5);
    ctx.lineTo(x-5, e.y+15);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+e.w+5, e.y+10);
    ctx.lineTo(x+e.w+12, e.y+5);
    ctx.lineTo(x+e.w+5, e.y+15);
    ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.fillRect(x+5, e.y+5, 4, 4);
    ctx.fillRect(x+16, e.y+5, 4, 4);
  }
}

function drawFlag() {
  const x = flag.x - cameraX;
  if (x < -50 || x > canvas.width + 50) return;
  
  ctx.fillStyle = '#888';
  ctx.fillRect(x, flag.y, flag.w, flag.h);
  ctx.fillStyle = '#00ff00';
  ctx.beginPath();
  ctx.moveTo(x + flag.w, flag.y);
  ctx.lineTo(x + flag.w + 30, flag.y + 10);
  ctx.lineTo(x + flag.w, flag.y + 20);
  ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(x + flag.w/2, flag.y, 6, 0, Math.PI*2);
  ctx.fill();
}

const decorations = [
  {type:'mountain', x:100, y:380, w:150, h:80},
  {type:'mountain', x:600, y:380, w:180, h:80},
  {type:'mountain', x:1200, y:380, w:150, h:80},
  {type:'mountain', x:1800, y:380, w:200, h:80},
  {type:'bush', x:300, y:440, w:60, h:20},
  {type:'bush', x:900, y:440, w:80, h:20},
  {type:'bush', x:1500, y:440, w:60, h:20},
  {type:'bush', x:2100, y:440, w:70, h:20},
];

function drawDecoration(d) {
  const x = d.x - cameraX;
  if (x + d.w < 0 || x > canvas.width) return;
  
  if (d.type === 'mountain') {
    ctx.fillStyle = '#3a8a3a';
    ctx.beginPath();
    ctx.moveTo(x, d.y + d.h);
    ctx.lineTo(x + d.w/2, d.y);
    ctx.lineTo(x + d.w, d.y + d.h);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x + d.w/2 - 15, d.y + 20);
    ctx.lineTo(x + d.w/2, d.y);
    ctx.lineTo(x + d.w/2 + 15, d.y + 20);
    ctx.fill();
  } else if (d.type === 'bush') {
    ctx.fillStyle = '#2d7a2d';
    ctx.beginPath();
    ctx.arc(x + 15, d.y + 10, 15, 0, Math.PI*2);
    ctx.arc(x + 35, d.y + 10, 18, 0, Math.PI*2);
    ctx.arc(x + 55, d.y + 10, 15, 0, Math.PI*2);
    ctx.fill();
  }
}

function update() {
  if (gameOver || won || paused) return;

  if (keys.left) player.vx = -3;
  else if (keys.right) player.vx = 3;
  else player.vx = 0;

  if (keys.jump && player.onGround) {
    player.vy = -10;
    player.onGround = false;
    vibrate('light');
    playJumpSound();
  }

  player.vy += 0.5;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

  cameraX = player.x - canvas.width / 2 + player.w / 2;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;

  if (invincible > 0) invincible--;

  player.onGround = false;
  for (const p of platforms) {
    if (player.x < p.x + p.w && player.x + player.w > p.x &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 &&
        player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  if (player.y > WORLD_HEIGHT) {
    hurtPlayer();
    return;
  }

  for (const c of coins) {
    if (!c.taken && Math.abs(player.x+15-c.x) < 20 && Math.abs(player.y+20-c.y) < 20) {
      c.taken = true;
      score += 10;
      vibrate('success');
      playCoinSound();
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    
    if (e.type === 'goomba') {
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    } else if (e.type === 'flying') {
      e.y += e.vy;
      if (e.y < e.minY || e.y > e.maxY) e.vy *= -1;
    }

    if (player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      
      // ИСПРАВЛЕННАЯ ЛОГИКА УБИЙСТВА ВРАГА
      // Игрок должен падать сверху (vy > 0) и его ноги должны быть выше середины врага
      const playerBottom = player.y + player.h;
      const enemyTop = e.y;
      const enemyMiddle = e.y + e.h * 0.6; // 60% высоты врага — более щедрая зона
      
      if (player.vy > 0 && playerBottom < enemyMiddle && playerBottom > enemyTop - 10) {
        // Убил врага!
        e.alive = false;
        player.vy = -7;
        score += 50;
        vibrate('success');
        playEnemyKillSound();
      } else if (invincible === 0) {
        hurtPlayer();
        return;
      }
    }
  }

  // ФИНИШНЫЙ ФЛАГ — проверяем только если все монетки собраны ИЛИ игрок коснулся флага сбоку
  if (player.x + player.w > flag.x && player.x < flag.x + flag.w + 30 &&
      player.y + player.h > flag.y && player.y < flag.y + flag.h) {
    won = true;
    score += 200;
    vibrate('success');
    stopMusic();
    playWinSound();
    showOverlay('🏆 ПОБЕДА!', 'Ты дошёл до финиша! Очки: ' + score);
  }
}

function hurtPlayer() {
  lives--;
  vibrate('error');
  playHurtSound();
  if (lives <= 0) {
    gameOver = true;
    stopMusic();
    playGameOverSound();
    showOverlay('💀 Game Over', 'Твой счёт: ' + score);
  } else {
    invincible = 120;
    player.x = 50;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    cameraX = 0;
  }
}

function showOverlay(title, text, showRestart = true) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  restartBtn.style.display = showRestart ? 'block' : 'none';
  overlay.style.display = 'flex';
}

function restart() {
  activateAudioOnInteraction();
  score = 0;
  lives = 3;
  invincible = 0;
  gameOver = false;
  won = false;
  paused = false;
  cameraX = 0;
  pauseBtn.textContent = '⏸';
  pauseBtn.classList.remove('active');
  player = { x:50, y:300, w:30, h:40, vx:0, vy:0, onGround:false };
  initLevel();
  overlay.style.display = 'none';
  if (soundEnabled) startMusic();
}
restartBtn.addEventListener('click', restart);

pauseBtn.addEventListener('click', () => {
  if (gameOver || won) return;
  paused = !paused;
  if (paused) {
    pauseBtn.textContent = '▶';
    pauseBtn.classList.add('active');
    showOverlay('⏸ Пауза', 'Нажми ▶ чтобы продолжить', false);
    stopMusic();
  } else {
    pauseBtn.textContent = '⏸';
    pauseBtn.classList.remove('active');
    overlay.style.display = 'none';
    if (soundEnabled) startMusic();
  }
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#fff';
  const cloudOffset = cameraX * 0.3;
  for (let i = 0; i < 8; i++) {
    const cx = (i * 350 - cloudOffset) % (WORLD_WIDTH + 200);
    const adjustedX = cx < -100 ? cx + WORLD_WIDTH + 200 : cx;
    ctx.beginPath();
    ctx.arc(adjustedX, 60 + (i%2)*30, 20, 0, Math.PI*2);
    ctx.arc(adjustedX + 25, 60 + (i%2)*30, 25, 0, Math.PI*2);
    ctx.arc(adjustedX + 50, 60 + (i%2)*30, 20, 0, Math.PI*2);
    ctx.fill();
  }
  
  decorations.forEach(drawDecoration);
  platforms.forEach(drawPlatform);
  coins.forEach(drawCoin);
  enemies.forEach(drawEnemy);
  drawFlag();
  drawMario();
  drawHearts();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = true;
  if (e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З') pauseBtn.click();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
});

// ========== УЛУЧШЕННЫЙ МУЛЬТИ-ТАЧ ==========
// Храним мапу: touchId → buttonId
const activeTouches = new Map();

function getButtonAtPoint(x, y) {
  const buttons = ['left', 'jump', 'right'];
  for (const id of buttons) {
    const el = document.getElementById(id);
    const rect = el.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return id;
    }
  }
  return null;
}

function setKey(buttonId, value) {
  if (buttonId === 'left') keys.left = value;
  else if (buttonId === 'right') keys.right = value;
  else if (buttonId === 'jump') keys.jump = value;
  
  const el = document.getElementById(buttonId);
  if (value) el.classList.add('active');
  else el.classList.remove('active');
}

// Обработчик для всех кнопок
document.addEventListener('touchstart', (e) => {
  activateAudioOnInteraction();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const btn = getButtonAtPoint(touch.clientX, touch.clientY);
    if (btn) {
      activeTouches.set(touch.identifier, btn);
      setKey(btn, true);
    }
  }
}, {passive: true});

document.addEventListener('touchmove', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const oldBtn = activeTouches.get(touch.identifier);
    const newBtn = getButtonAtPoint(touch.clientX, touch.clientY);
    
    if (oldBtn !== newBtn) {
      if (oldBtn) setKey(oldBtn, false);
      if (newBtn) {
        activeTouches.set(touch.identifier, newBtn);
        setKey(newBtn, true);
      } else {
        activeTouches.delete(touch.identifier);
      }
    }
  }
}, {passive: true});

document.addEventListener('touchend', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const btn = activeTouches.get(touch.identifier);
    if (btn) {
      setKey(btn, false);
      activeTouches.delete(touch.identifier);
    }
  }
}, {passive: true});

document.addEventListener('touchcancel', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    const btn = activeTouches.get(touch.identifier);
    if (btn) {
      setKey(btn, false);
      activeTouches.delete(touch.identifier);
    }
  }
}, {passive: true});

// Мышь (для ПК)
function bindMouseBtn(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('mousedown', (e) => {
    activateAudioOnInteraction();
    keys[key] = true;
    el.classList.add('active');
  });
  el.addEventListener('mouseup', () => {
    keys[key] = false;
    el.classList.remove('active');
  });
  el.addEventListener('mouseleave', () => {
    keys[key] = false;
    el.classList.remove('active');
  });
}

bindMouseBtn('left', 'left');
bindMouseBtn('right', 'right');
bindMouseBtn('jump', 'jump');

loop();
</script>
