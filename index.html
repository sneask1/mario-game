<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mario Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { margin:0; background:#5c94fc; display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; overflow:hidden; touch-action:none; }
  canvas { background:#5c94fc; border:4px solid #000; max-width:100%; touch-action:none; }
  #controls { position:fixed; bottom:20px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 15px; pointer-events:none; z-index:50; }
  .btn { width:80px; height:80px; background:rgba(255,255,255,0.3); color:#fff; border:3px solid rgba(255,255,255,0.7); border-radius:50%; font-size:36px; display:flex; justify-content:center; align-items:center; pointer-events:auto; transition: background 0.05s; box-shadow: 0 4px 8px rgba(0,0,0,0.3); touch-action:none; }
  .btn.active { background:rgba(229, 37, 33, 0.9); }
  .btn-jump { width:90px; height:90px; background:rgba(229, 37, 33, 0.6); font-size:40px; }
  .btn-jump.active { background:rgba(229, 37, 33, 1); }
  .btn-fire { width:75px; height:75px; background:rgba(255, 100, 0, 0.6); font-size:36px; margin-left:10px; }
  .btn-fire.active { background:rgba(255, 100, 0, 1); }
  #pauseBtn { position:fixed; top:80px; right:15px; width:50px; height:50px; background:rgba(0,0,0,0.5); color:#fff; border:2px solid rgba(255,255,255,0.7); border-radius:50%; font-size:20px; display:flex; justify-content:center; align-items:center; z-index:200; }
  #pauseBtn.active { background:rgba(229, 37, 33, 0.9); }
  #soundToggle { position:fixed; top:140px; right:15px; width:50px; height:50px; background:rgba(0,0,0,0.5); color:#fff; border:2px solid rgba(255,255,255,0.7); border-radius:50%; font-size:20px; display:flex; justify-content:center; align-items:center; z-index:200; }
  #activePowerUps { position:fixed; top:80px; left:15px; display:flex; flex-direction:column; gap:5px; z-index:50; pointer-events:none; }
  .ap-item { background:rgba(0,0,0,0.6); color:#fff; padding:5px 12px; border-radius:15px; font-size:16px; font-weight:bold; display:none; border:2px solid rgba(255,255,255,0.5); min-width:60px; text-align:center; }
  .ap-item.active { display:flex; align-items:center; gap:5px; }
  #apStar { background:rgba(255, 215, 0, 0.7); color:#000; }
  #apFire { background:rgba(255, 100, 0, 0.7); }
  #apMushroom { background:rgba(229, 37, 33, 0.7); }
  #overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; flex-direction:column; color:#fff; text-align:center; z-index:100; }
  #overlay h1 { font-size:48px; margin:10px; text-shadow:3px 3px 0 #000; }
  #overlay p { font-size:24px; margin:10px; }
  #restartBtn { padding:15px 40px; font-size:24px; background:#e52521; color:#fff; border:none; border-radius:10px; margin-top:20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<canvas id="game" width="400" height="500"></canvas>
<div id="pauseBtn">⏸</div>
<div id="soundToggle">🔊</div>
<div id="activePowerUps">
  <div id="apMushroom" class="ap-item">🍄 BIG</div>
  <div id="apStar" class="ap-item">⭐ <span id="starTimerText">8.0</span></div>
  <div id="apFire" class="ap-item">🔥 FIRE</div>
</div>
<div id="controls">
  <button class="btn" id="left">◀</button>
  <div style="display:flex; gap:10px; align-items:flex-end;">
    <button class="btn btn-jump" id="jump">▲</button>
    <button class="btn btn-fire" id="fire" style="display:none">🔥</button>
  </div>
  <button class="btn" id="right">▶</button>
</div>
<div id="overlay">
  <h1 id="overlayTitle">Game Over</h1>
  <p id="overlayText">Очки: 0</p>
  <button id="restartBtn">Играть снова</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const soundToggle = document.getElementById('soundToggle');
const apMushroom = document.getElementById('apMushroom');
const apStar = document.getElementById('apStar');
const apFire = document.getElementById('apFire');
const starTimerText = document.getElementById('starTimerText');

const MARIO_SMALL = { w: 30, h: 40 };
const MARIO_BIG = { w: 30, h: 60 };

// ========== ЗВУК ==========
let audioCtx = null;
let soundEnabled = true;
let musicEnabled = true;
let musicInterval = null;
let starMusicInterval = null;
let audioInitialized = false;

function initAudio() {
  if (audioInitialized) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioInitialized = true;
  } catch(e) {}
}

function activateAudioOnInteraction() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      if (soundEnabled && musicInterval === null && starMusicInterval === null) {
        if (player && player.starTimer > 0) startStarMusic();
        else startMusic();
      }
    });
  } else if (audioCtx && soundEnabled && musicInterval === null && starMusicInterval === null) {
    if (player && player.starTimer > 0) startStarMusic();
    else startMusic();
  }
}

function playTone(freq, duration, type, volume) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playJumpSound() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } catch(e) {}
}

function playCoinSound() {
  playTone(988, 0.1, 'square', 0.08);
  setTimeout(() => playTone(1319, 0.15, 'square', 0.08), 80);
}

function playEnemyKillSound() {
  playTone(400, 0.05, 'square', 0.1);
  setTimeout(() => playTone(600, 0.1, 'square', 0.1), 50);
}

function playHurtSound() {
  playTone(300, 0.1, 'sawtooth', 0.15);
  setTimeout(() => playTone(200, 0.15, 'sawtooth', 0.15), 100);
}

function playGameOverSound() {
  [523, 494, 440, 392, 349, 330, 294, 262].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.2, 'square', 0.12), i * 150);
  });
}

function playWinSound() {
  [523, 659, 784, 1047, 784, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.15, 'square', 0.12), i * 120);
  });
}

function playPowerUpSound() {
  [523, 659, 784, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.1, 'square', 0.12), i * 60);
  });
}

function playShrinkSound() {
  [784, 523, 392].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.1, 'square', 0.12), i * 80);
  });
}

function playBlockHitSound() {
  playTone(250, 0.08, 'square', 0.15);
  setTimeout(() => playTone(400, 0.1, 'square', 0.12), 50);
}

function playFireSound() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } catch(e) {}
}

const starMusicNotes = [784, 988, 1175, 988, 1175, 1568, 1175, 1568, 1976, 1568, 1976, 1568];
let starMusicIndex = 0;

function startStarMusic() {
  stopStarMusic();
  if (!soundEnabled || !audioCtx) return;
  starMusicIndex = 0;
  starMusicInterval = setInterval(() => {
    if (!soundEnabled || !audioCtx || player.starTimer <= 0) { stopStarMusic(); return; }
    playTone(starMusicNotes[starMusicIndex % starMusicNotes.length], 0.08, 'square', 0.05);
    starMusicIndex++;
  }, 100);
}

function stopStarMusic() {
  if (starMusicInterval) { clearInterval(starMusicInterval); starMusicInterval = null; }
}

// Спокойная не зацикленная музыка
const musicNotes = [
  392, 0, 440, 0, 494, 0, 523, 0, 494, 0, 440, 0, 392, 0, 0, 0,
  349, 0, 392, 0, 440, 0, 494, 0, 440, 0, 392, 0, 349, 0, 0, 0,
  523, 0, 587, 0, 659, 0, 587, 0, 523, 0, 494, 0, 440, 0, 0, 0,
  392, 0, 440, 0, 494, 0, 523, 0, 587, 0, 523, 0, 494, 0, 0, 0,
  659, 0, 587, 0, 523, 0, 494, 0, 440, 0, 392, 0, 349, 0, 0, 0,
  330, 0, 349, 0, 392, 0, 440, 0, 392, 0, 349, 0, 330, 0, 0, 0,
];
let musicIndex = 0;

function startMusic() {
  if (!musicEnabled || !audioCtx || player.starTimer > 0) return;
  stopMusic();
  musicIndex = 0;
  musicInterval = setInterval(() => {
    if (!musicEnabled || !audioCtx || player.starTimer > 0) { stopMusic(); return; }
    if (musicIndex >= musicNotes.length) { stopMusic(); return; }
    const freq = musicNotes[musicIndex];
    if (freq > 0) playTone(freq, 0.2, 'sine', 0.03);
    musicIndex++;
  }, 250);
}

function stopMusic() {
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
}

soundToggle.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  musicEnabled = soundEnabled;
  soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) {
    initAudio();
    if (player.starTimer > 0) startStarMusic();
    else startMusic();
  } else {
    stopMusic();
    stopStarMusic();
  }
});

// ========== ИГРА ==========
const WORLD_WIDTH = 3200;
const WORLD_HEIGHT = 500;

const keys = { left:false, right:false, jump:false, fire:false };
let cameraX = 0;
let frameCount = 0;

let player = { 
  x:50, y:300, w:MARIO_SMALL.w, h:MARIO_SMALL.h, 
  vx:0, vy:0, onGround:false,
  isBig: false, hasFire: false, starTimer: 0,
  lastFireTime: 0, direction: 1
};

let score = 0;
let lives = 3;
let invincible = 0;
let gameOver = false;
let won = false;
let paused = false;

// РАСШИРЕННЫЙ УРОВЕНЬ
const platforms = [
  // Зона 1 (0-500)
  {x:0, y:460, w:500, h:40},
  {x:180, y:380, w:80, h:15},
  {x:320, y:320, w:80, h:15},
  // Зона 2 (500-900)
  {x:550, y:460, w:180, h:40},
  {x:600, y:360, w:80, h:15},
  {x:750, y:300, w:100, h:15},
  {x:870, y:380, w:80, h:15},
  // Зона 3 (900-1350)
  {x:1000, y:460, w:120, h:40},
  {x:1100, y:400, w:70, h:15},
  {x:1200, y:340, w:70, h:15},
  {x:1130, y:260, w:90, h:15},
  {x:1260, y:200, w:90, h:15},
  // Зона 4 (1350-1800)
  {x:1380, y:460, w:100, h:40},
  {x:1520, y:400, w:70, h:15},
  {x:1620, y:340, w:70, h:15},
  {x:1520, y:260, w:90, h:15},
  {x:1680, y:200, w:110, h:15},
  // Зона 5 (1800-2300)
  {x:1830, y:460, w:140, h:40},
  {x:1980, y:380, w:90, h:15},
  {x:2100, y:320, w:90, h:15},
  {x:1980, y:240, w:90, h:15},
  // Зона 6 (2300-2800)
  {x:2250, y:460, w:150, h:40},
  {x:2450, y:380, w:90, h:15},
  {x:2580, y:320, w:90, h:15},
  {x:2450, y:240, w:90, h:15},
  // Зона 7 (2800-3200) - финал
  {x:2750, y:460, w:150, h:40},
  {x:2950, y:380, w:100, h:15},
  {x:3080, y:320, w:120, h:15},
];

// БЛОКИ ПОДНЯТЫ ВЫШЕ - теперь над ними есть место для прыжка
const questionBlocks = [
  {x:200, y:280, w:30, h:30, activated:false, bounceTime:0},
  {x:780, y:200, w:30, h:30, activated:false, bounceTime:0},
  {x:1230, y:160, w:30, h:30, activated:false, bounceTime:0},
  {x:1650, y:240, w:30, h:30, activated:false, bounceTime:0},
  {x:2020, y:280, w:30, h:30, activated:false, bounceTime:0},
  {x:2490, y:280, w:30, h:30, activated:false, bounceTime:0},
  {x:2980, y:280, w:30, h:30, activated:false, bounceTime:0},
];

let coins = [];
let enemies = [];
let powerUps = [];
let fireballs = [];

const flag = { x: 3130, y: 380, w: 10, h: 80 };

function getRandomPowerUp() {
  const r = Math.random();
  if (r < 0.4) return 'mushroom';
  if (r < 0.7) return 'star';
  return 'flower';
}

function initLevel() {
  coins = [
    // Зона 1
    {x:200, y:350, taken:false}, {x:350, y:290, taken:false}, {x:420, y:430, taken:false},
    // Зона 2
    {x:630, y:330, taken:false}, {x:790, y:270, taken:false}, {x:900, y:350, taken:false}, {x:670, y:430, taken:false},
    // Зона 3
    {x:1130, y:370, taken:false}, {x:1230, y:310, taken:false}, {x:1160, y:230, taken:false}, {x:1290, y:170, taken:false},
    // Зона 4
    {x:1550, y:370, taken:false}, {x:1650, y:310, taken:false}, {x:1550, y:230, taken:false}, {x:1720, y:170, taken:false}, {x:1420, y:430, taken:false},
    // Зона 5
    {x:2020, y:350, taken:false}, {x:2130, y:290, taken:false}, {x:2020, y:210, taken:false}, {x:1880, y:430, taken:false},
    // Зона 6
    {x:2490, y:350, taken:false}, {x:2610, y:290, taken:false}, {x:2490, y:210, taken:false}, {x:2300, y:430, taken:false},
    // Зона 7
    {x:2990, y:350, taken:false}, {x:3110, y:290, taken:false}, {x:2800, y:430, taken:false}, {x:2880, y:430, taken:false}, {x:3150, y:430, taken:false},
  ];
  
  enemies = [
    {x:250, y:440, w:25, h:20, vx:1, minX:50, maxX:450, alive:true, type:'goomba'},
    {x:600, y:440, w:25, h:20, vx:-1, minX:550, maxX:705, alive:true, type:'goomba'},
    {x:1020, y:440, w:25, h:20, vx:1, minX:1000, maxX:1095, alive:true, type:'goomba'},
    {x:1400, y:440, w:25, h:20, vx:-1, minX:1380, maxX:1455, alive:true, type:'goomba'},
    {x:1870, y:440, w:25, h:20, vx:1, minX:1830, maxX:1945, alive:true, type:'goomba'},
    {x:2290, y:440, w:25, h:20, vx:-1, minX:2250, maxX:2375, alive:true, type:'goomba'},
    {x:2790, y:440, w:25, h:20, vx:1, minX:2750, maxX:2875, alive:true, type:'goomba'},
    {x:800, y:200, w:25, h:20, vy:1, minY:150, maxY:280, alive:true, type:'flying'},
    {x:1570, y:150, w:25, h:20, vy:-1, minY:100, maxY:230, alive:true, type:'flying'},
    {x:2520, y:180, w:25, h:20, vy:1, minY:130, maxY:260, alive:true, type:'flying'},
  ];
  
  powerUps = [];
  fireballs = [];
  
  for (const block of questionBlocks) {
    block.activated = false;
    block.bounceTime = 0;
    block.content = getRandomPowerUp();
  }
}
initLevel();

function vibrate(style) {
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      const hf = window.Telegram.WebApp.HapticFeedback;
      if (style === 'light' || style === 'heavy') hf.impactOccurred(style);
      else hf.notificationOccurred(style);
    } catch(e) {}
  }
}

function spawnPowerUp(block) {
  powerUps.push({
    type: block.content, x: block.x, y: block.y,
    w: 25, h: 25, vx: 1.5, vy: 0,
    state: 'emerging', emergeProgress: 0, sourceY: block.y
  });
}

function collectPowerUp(pu) {
  pu.collected = true;
  playPowerUpSound();
  vibrate('success');
  score += 100;
  
  if (pu.type === 'mushroom') {
    if (player.isBig) lives++;
    else growMario();
  } else if (pu.type === 'star') {
    player.starTimer = 8 * 60;
    stopMusic();
    startStarMusic();
  } else if (pu.type === 'flower') {
    player.hasFire = true;
    document.getElementById('fire').style.display = 'flex';
  }
}

function growMario() {
  const oldH = player.h;
  player.isBig = true;
  player.h = MARIO_BIG.h;
  player.w = MARIO_BIG.w;
  player.y -= (player.h - oldH);
}

function shrinkMario() {
  const oldH = player.h;
  player.isBig = false;
  player.h = MARIO_SMALL.h;
  player.w = MARIO_SMALL.w;
  player.y += (oldH - player.h);
}

function resetPowerUpState() {
  player.isBig = false;
  player.hasFire = false;
  player.starTimer = 0;
  player.h = MARIO_SMALL.h;
  player.w = MARIO_SMALL.w;
  document.getElementById('fire').style.display = 'none';
  stopStarMusic();
}

function fireFireball() {
  if (!player.hasFire) return;
  const now = Date.now();
  if (now - player.lastFireTime < 450) return;
  player.lastFireTime = now;
  fireballs.push({
    x: player.x + (player.direction > 0 ? player.w : -12),
    y: player.y + player.h / 2 - 6,
    vx: player.direction * 6, vy: 0, w: 12, h: 12
  });
  playFireSound();
  vibrate('light');
}

function updateFireballs() {
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.vy += 0.4;
    fb.y += fb.vy;
    
    for (const p of platforms) {
      if (fb.x < p.x + p.w && fb.x + fb.w > p.x &&
          fb.y + fb.h > p.y && fb.y + fb.h < p.y + p.h + 10 && fb.vy >= 0) {
        fb.y = p.y - fb.h;
        fb.vy = -6;
      }
    }
    
    if (fb.x < cameraX - 50 || fb.x > cameraX + canvas.width + 50 || fb.y > WORLD_HEIGHT) {
      fireballs.splice(i, 1);
      continue;
    }
    
    for (const e of enemies) {
      if (!e.alive) continue;
      if (fb.x < e.x + e.w && fb.x + fb.w > e.x &&
          fb.y < e.y + e.h && fb.y + fb.h > e.y) {
        e.alive = false;
        score += 50;
        vibrate('success');
        playEnemyKillSound();
        fireballs.splice(i, 1);
        break;
      }
    }
  }
}

// ========== ОТРИСОВКА (ОПТИМИЗИРОВАНА) ==========
function drawMario() {
  if (invincible > 0 && (frameCount >> 2) & 1 && player.starTimer === 0) return;
  
  const x = player.x - cameraX;
  const y = player.y;
  const w = player.w;
  const h = player.h;
  
  let hatColor, shirtColor, pantsColor;
  
  if (player.starTimer > 0) {
    const colors = ['#e52521', '#ff8c00', '#ffd700', '#32cd32', '#1e90ff', '#8a2be2'];
    const ci = (frameCount >> 3) % colors.length;
    hatColor = colors[ci];
    shirtColor = '#fcb89c';
    pantsColor = colors[(ci + 2) % colors.length];
  } else if (player.hasFire) {
    hatColor = '#e52521';
    shirtColor = '#fff';
    pantsColor = '#e52521';
  } else {
    hatColor = '#e52521';
    shirtColor = '#fcb89c';
    pantsColor = '#1f5fd6';
  }
  
  ctx.fillStyle = hatColor;
  ctx.fillRect(x, y, w, h * 0.3);
  ctx.fillStyle = shirtColor;
  ctx.fillRect(x + w*0.15, y + h*0.3, w*0.7, h*0.3);
  ctx.fillStyle = pantsColor;
  ctx.fillRect(x + w*0.1, y + h*0.6, w*0.8, h*0.4);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + w*0.25, y + h*0.5, w*0.5, Math.max(2, h*0.05));
}

function drawHearts() {
  for (let i = 0; i < 3; i++) {
    const x = 15 + i * 30;
    const y = 15;
    if (i < lives) {
      ctx.fillStyle = '#e52521';
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 6, 0, Math.PI * 2);
      ctx.arc(x + 15, y + 5, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 10, y + 20);
      ctx.lineTo(x + 20, y + 8);
      ctx.fill();
    } else {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 6, 0, Math.PI * 2);
      ctx.arc(x + 15, y + 5, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 10, y + 20);
      ctx.lineTo(x + 20, y + 8);
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('Очки: ' + score, 15, 55);
}

function drawPlatform(p) {
  const x = p.x - cameraX;
  if (x + p.w < 0 || x > canvas.width) return;
  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(x, p.y, p.w, p.h);
  ctx.fillStyle = '#fca044';
  ctx.fillRect(x, p.y, p.w, 4);
}

function drawQuestionBlock(block) {
  const x = block.x - cameraX;
  if (x + block.w < 0 || x > canvas.width) return;
  const bounceOffset = block.bounceTime > 0 ? -Math.sin(block.bounceTime / 10 * Math.PI) * 5 : 0;
  const y = block.y + bounceOffset;
  
  if (block.activated) {
    ctx.fillStyle = '#8b4513';
  } else {
    ctx.fillStyle = '#ffa500';
  }
  ctx.fillRect(x, y, block.w, block.h);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, block.w, block.h);
  
  if (!block.activated) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('?', x + 9, y + 22);
  }
}

function drawCoin(c) {
  if (c.taken) return;
  const x = c.x - cameraX;
  if (x < -20 || x > canvas.width + 20) return;
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(x, c.y, 8, 0, Math.PI*2);
  ctx.fill();
}

function drawEnemy(e) {
  if (!e.alive) return;
  const x = e.x - cameraX;
  if (x + e.w < 0 || x > canvas.width) return;
  
  if (e.type === 'goomba') {
    ctx.fillStyle = '#6b3410';
    ctx.fillRect(x, e.y, e.w, e.h);
    ctx.fillStyle = '#000';
    ctx.fillRect(x+5, e.y+5, 4, 4);
    ctx.fillRect(x+16, e.y+5, 4, 4);
  } else {
    ctx.fillStyle = '#8b3fc7';
    ctx.fillRect(x, e.y, e.w, e.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x-5, e.y+10);
    ctx.lineTo(x-12, e.y+5);
    ctx.lineTo(x-5, e.y+15);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+e.w+5, e.y+10);
    ctx.lineTo(x+e.w+12, e.y+5);
    ctx.lineTo(x+e.w+5, e.y+15);
    ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.fillRect(x+5, e.y+5, 4, 4);
    ctx.fillRect(x+16, e.y+5, 4, 4);
  }
}

function drawFlag() {
  const x = flag.x - cameraX;
  if (x < -50 || x > canvas.width + 50) return;
  ctx.fillStyle = '#888';
  ctx.fillRect(x, flag.y, flag.w, flag.h);
  ctx.fillStyle = '#00ff00';
  ctx.beginPath();
  ctx.moveTo(x + flag.w, flag.y);
  ctx.lineTo(x + flag.w + 30, flag.y + 10);
  ctx.lineTo(x + flag.w, flag.y + 20);
  ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(x + flag.w/2, flag.y, 6, 0, Math.PI*2);
  ctx.fill();
}

function drawPowerUp(pu) {
  if (pu.collected) return;
  const x = pu.x - cameraX;
  if (x + pu.w < 0 || x > canvas.width) return;
  
  if (pu.type === 'mushroom') {
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + pu.w*0.3, pu.y + pu.h*0.5, pu.w*0.4, pu.h*0.5);
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.arc(x + pu.w/2, pu.y + pu.h*0.4, pu.w*0.5, Math.PI, 0);
    ctx.fill();
  } else if (pu.type === 'star') {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    const cx = x + pu.w/2;
    const cy = pu.y + pu.h/2;
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? pu.w/2 : pu.w/4;
      const angle = (i * Math.PI / 5) - Math.PI/2;
      const px = cx + r * Math.cos(angle);
      const py = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.fill();
  } else if (pu.type === 'flower') {
    ctx.fillStyle = '#2d7a2d';
    ctx.fillRect(x + pu.w*0.45, pu.y + pu.h*0.5, pu.w*0.1, pu.h*0.5);
    ctx.fillStyle = '#ff69b4';
    const cx = x + pu.w/2;
    const cy = pu.y + pu.h*0.35;
    for (let i = 0; i < 5; i++) {
      const angle = (i * Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.arc(cx + Math.cos(angle) * pu.w*0.25, cy + Math.sin(angle) * pu.w*0.25, pu.w*0.15, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(cx, cy, pu.w*0.15, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawFireballs() {
  for (const fb of fireballs) {
    const x = fb.x - cameraX;
    if (x < -20 || x > canvas.width + 20) continue;
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.arc(x + fb.w/2, fb.y + fb.h/2, fb.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(x + fb.w/2, fb.y + fb.h/2, fb.w/4, 0, Math.PI*2);
    ctx.fill();
  }
}

// Упрощённые декорации - меньше кругов
const decorations = [
  {type:'mountain', x:100, y:380, w:150, h:80},
  {type:'mountain', x:700, y:380, w:180, h:80},
  {type:'mountain', x:1400, y:380, w:150, h:80},
  {type:'mountain', x:2100, y:380, w:200, h:80},
  {type:'mountain', x:2800, y:380, w:170, h:80},
  {type:'bush', x:350, y:440, w:60, h:20},
  {type:'bush', x:1000, y:440, w:80, h:20},
  {type:'bush', x:1700, y:440, w:60, h:20},
  {type:'bush', x:2400, y:440, w:70, h:20},
  {type:'bush', x:3000, y:440, w:60, h:20},
];

function drawDecoration(d) {
  const x = d.x - cameraX;
  if (x + d.w < 0 || x > canvas.width) return;
  if (d.type === 'mountain') {
    ctx.fillStyle = '#3a8a3a';
    ctx.beginPath();
    ctx.moveTo(x, d.y + d.h);
    ctx.lineTo(x + d.w/2, d.y);
    ctx.lineTo(x + d.w, d.y + d.h);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x + d.w/2 - 15, d.y + 20);
    ctx.lineTo(x + d.w/2, d.y);
    ctx.lineTo(x + d.w/2 + 15, d.y + 20);
    ctx.fill();
  } else {
    ctx.fillStyle = '#2d7a2d';
    ctx.beginPath();
    ctx.arc(x + 15, d.y + 10, 15, 0, Math.PI*2);
    ctx.arc(x + 35, d.y + 10, 18, 0, Math.PI*2);
    ctx.arc(x + 55, d.y + 10, 15, 0, Math.PI*2);
    ctx.fill();
  }
}

// ========== ОБНОВЛЕНИЕ ==========
function update() {
  if (gameOver || won || paused) return;
  frameCount++;

  if (keys.left) { player.vx = -3; player.direction = -1; }
  else if (keys.right) { player.vx = 3; player.direction = 1; }
  else player.vx = 0;

  if (keys.jump && player.onGround) {
    player.vy = -10;
    player.onGround = false;
    vibrate('light');
    playJumpSound();
  }

  if (keys.fire && player.hasFire) fireFireball();

  player.vy += 0.5;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

  cameraX = player.x - canvas.width / 2 + player.w / 2;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;

  if (invincible > 0) invincible--;
  
  if (player.starTimer > 0) {
    player.starTimer--;
    if (frameCount % 6 === 0) {
      starTimerText.textContent = (player.starTimer / 60).toFixed(1);
    }
    if (player.starTimer === 0) {
      stopStarMusic();
      if (soundEnabled) startMusic();
    }
  }

  player.onGround = false;
  for (const p of platforms) {
    if (player.x < p.x + p.w && player.x + player.w > p.x &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 && player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  for (const block of questionBlocks) {
    const bounceOffset = block.bounceTime > 0 ? -Math.sin(block.bounceTime / 10 * Math.PI) * 5 : 0;
    const by = block.y + bounceOffset;
    
    if (player.x < block.x + block.w && player.x + player.w > block.x) {
      if (player.y + player.h > by && player.y + player.h < by + block.h + 10 && player.vy >= 0) {
        player.y = by - player.h;
        player.vy = 0;
        player.onGround = true;
      }
      if (!block.activated && player.y < by + block.h && player.y > by && player.vy < 0) {
        block.activated = true;
        block.bounceTime = 10;
        player.vy = 1;
        spawnPowerUp(block);
        playBlockHitSound();
        vibrate('light');
      }
    }
    if (block.bounceTime > 0) block.bounceTime--;
  }

  if (player.y > WORLD_HEIGHT) { hurtPlayer(); return; }

  for (const c of coins) {
    if (!c.taken && Math.abs(player.x+15-c.x) < 20 && Math.abs(player.y+20-c.y) < 20) {
      c.taken = true;
      score += 10;
      vibrate('success');
      playCoinSound();
    }
  }

  for (let i = powerUps.length - 1; i >= 0; i--) {
    const pu = powerUps[i];
    if (pu.collected) { powerUps.splice(i, 1); continue; }
    
    if (pu.state === 'emerging') {
      pu.emergeProgress += 1;
      pu.y = pu.sourceY - pu.emergeProgress;
      if (pu.emergeProgress >= 30) { pu.state = 'moving'; pu.y = pu.sourceY - 30; }
    } else {
      pu.x += pu.vx;
      pu.vy += 0.5;
      pu.y += pu.vy;
      for (const p of platforms) {
        if (pu.x < p.x + p.w && pu.x + pu.w > p.x &&
            pu.y + pu.h > p.y && pu.y + pu.h < p.y + p.h + 10 && pu.vy >= 0) {
          pu.y = p.y - pu.h;
          pu.vy = 0;
        }
      }
      if (pu.y > WORLD_HEIGHT) { powerUps.splice(i, 1); continue; }
    }
    
    if (player.x < pu.x + pu.w && player.x + player.w > pu.x &&
        player.y < pu.y + pu.h && player.y + player.h > pu.y) {
      collectPowerUp(pu);
    }
  }

  updateFireballs();

  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === 'goomba') {
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    } else {
      e.y += e.vy;
      if (e.y < e.minY || e.y > e.maxY) e.vy *= -1;
    }

    if (player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.starTimer > 0) {
        e.alive = false;
        player.vy = -5;
        score += 50;
        vibrate('success');
        playEnemyKillSound();
      } else {
        const playerBottom = player.y + player.h;
        const enemyTop = e.y;
        const enemyMiddle = e.y + e.h * 0.6;
        if (player.vy > 0 && playerBottom < enemyMiddle && playerBottom > enemyTop - 10) {
          e.alive = false;
          player.vy = -7;
          score += 50;
          vibrate('success');
          playEnemyKillSound();
        } else if (invincible === 0) {
          hurtPlayer();
          return;
        }
      }
    }
  }

  if (player.x + player.w > flag.x && player.x < flag.x + flag.w + 30 &&
      player.y + player.h > flag.y && player.y < flag.y + flag.h) {
    won = true;
    score += 200;
    vibrate('success');
    stopMusic();
    stopStarMusic();
    playWinSound();
    showOverlay('🏆 ПОБЕДА!', 'Ты дошёл до финиша! Очки: ' + score);
  }
  
  updatePowerUpUI();
}

function updatePowerUpUI() {
  apMushroom.classList.toggle('active', player.isBig);
  apStar.classList.toggle('active', player.starTimer > 0);
  apFire.classList.toggle('active', player.hasFire);
}

function hurtPlayer() {
  if (player.starTimer > 0) return;
  if (player.isBig) {
    shrinkMario();
    player.hasFire = false;
    document.getElementById('fire').style.display = 'none';
    invincible = 120;
    playShrinkSound();
    vibrate('error');
    return;
  }
  lives--;
  vibrate('error');
  playHurtSound();
  if (lives <= 0) {
    gameOver = true;
    stopMusic();
    stopStarMusic();
    playGameOverSound();
    showOverlay('💀 Game Over', 'Твой счёт: ' + score);
  } else {
    resetPowerUpState();
    invincible = 120;
    player.x = 50;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    cameraX = 0;
  }
}

function showOverlay(title, text, showRestart = true) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  restartBtn.style.display = showRestart ? 'block' : 'none';
  overlay.style.display = 'flex';
}

function restart() {
  activateAudioOnInteraction();
  score = 0; lives = 3; invincible = 0;
  gameOver = false; won = false; paused = false; cameraX = 0;
  pauseBtn.textContent = '⏸';
  pauseBtn.classList.remove('active');
  player = { 
    x:50, y:300, w:MARIO_SMALL.w, h:MARIO_SMALL.h, 
    vx:0, vy:0, onGround:false,
    isBig: false, hasFire: false, starTimer: 0,
    lastFireTime: 0, direction: 1
  };
  initLevel();
  overlay.style.display = 'none';
  if (soundEnabled) startMusic();
}
restartBtn.addEventListener('click', restart);

pauseBtn.addEventListener('click', () => {
  if (gameOver || won) return;
  paused = !paused;
  if (paused) {
    pauseBtn.textContent = '▶';
    pauseBtn.classList.add('active');
    showOverlay('⏸ Пауза', 'Нажми ▶ чтобы продолжить', false);
    stopMusic();
    stopStarMusic();
  } else {
    pauseBtn.textContent = '⏸';
    pauseBtn.classList.remove('active');
    overlay.style.display = 'none';
    if (soundEnabled) {
      if (player.starTimer > 0) startStarMusic();
      else startMusic();
    }
  }
});

function draw() {
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Облака (упрощённые)
  ctx.fillStyle = '#fff';
  const cloudOffset = cameraX * 0.3;
  for (let i = 0; i < 10; i++) {
    let cx = (i * 350 - cloudOffset) % (WORLD_WIDTH + 200);
    if (cx < -100) cx += WORLD_WIDTH + 200;
    if (cx > canvas.width + 100) continue;
    const cy = 60 + (i%2)*30;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.arc(cx + 25, cy, 27, 0, Math.PI*2);
    ctx.arc(cx + 50, cy, 22, 0, Math.PI*2);
    ctx.fill();
  }
  
  decorations.forEach(drawDecoration);
  platforms.forEach(drawPlatform);
  questionBlocks.forEach(drawQuestionBlock);
  coins.forEach(drawCoin);
  enemies.forEach(drawEnemy);
  powerUps.forEach(drawPowerUp);
  drawFireballs();
  drawFlag();
  drawMario();
  drawHearts();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ========== УПРАВЛЕНИЕ ==========
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === ' ') { keys.jump = true; e.preventDefault(); }
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') { keys.fire = true; e.preventDefault(); }
  if (!e.repeat && (e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З')) { pauseBtn.click(); e.preventDefault(); }
}, { passive: false });

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') keys.fire = false;
});

// Оптимизированный мульти-тач с кешированием rect
const activeTouches = new Map();
const buttonCache = new Map();

function updateButtonCache() {
  buttonCache.clear();
  ['left', 'jump', 'right', 'fire'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.style.display !== 'none') {
      buttonCache.set(id, el.getBoundingClientRect());
    }
  });
}

// Обновляем кеш при изменении размера окна и периодически
window.addEventListener('resize', updateButtonCache);
window.addEventListener('orientationchange', () => setTimeout(updateButtonCache, 100));
setTimeout(updateButtonCache, 100);

function getButtonAtPoint(x, y) {
  const padding = 15;
  for (const [id, rect] of buttonCache.entries()) {
    if (x >= rect.left - padding && x <= rect.right + padding &&
        y >= rect.top - padding && y <= rect.bottom + padding) {
      return id;
    }
  }
  return null;
}

function rebuildKeysFromTouches() {
  keys.left = false;
  keys.right = false;
  keys.jump = false;
  keys.fire = false;

  for (const buttonId of activeTouches.values()) {
    if (buttonId === 'left') keys.left = true;
    else if (buttonId === 'right') keys.right = true;
    else if (buttonId === 'jump') keys.jump = true;
    else if (buttonId === 'fire') keys.fire = true;
  }

  ['left', 'right', 'jump', 'fire'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isActive = (id === 'left' && keys.left) || (id === 'right' && keys.right) ||
                     (id === 'jump' && keys.jump) || (id === 'fire' && keys.fire);
    if (isActive) el.classList.add('active');
    else el.classList.remove('active');
  });
}

document.addEventListener('touchstart', e => {
  activateAudioOnInteraction();
  let used = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const btn = getButtonAtPoint(t.clientX, t.clientY);
    if (btn) { activeTouches.set(t.identifier, btn); used = true; }
  }
  if (used) { rebuildKeysFromTouches(); e.preventDefault(); }
}, { passive: false });

document.addEventListener('touchmove', e => {
  let used = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const oldBtn = activeTouches.get(t.identifier);
    const newBtn = getButtonAtPoint(t.clientX, t.clientY);
    if (oldBtn !== newBtn) {
      used = true;
      if (newBtn) activeTouches.set(t.identifier, newBtn);
      else activeTouches.delete(t.identifier);
    }
  }
  if (used) { rebuildKeysFromTouches(); e.preventDefault(); }
}, { passive: false });

document.addEventListener('touchend', e => {
  let used = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (activeTouches.has(t.identifier)) { activeTouches.delete(t.identifier); used = true; }
  }
  if (used) { rebuildKeysFromTouches(); e.preventDefault(); }
}, { passive: false });

document.addEventListener('touchcancel', e => {
  let used = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (activeTouches.has(t.identifier)) { activeTouches.delete(t.identifier); used = true; }
  }
  if (used) { rebuildKeysFromTouches(); e.preventDefault(); }
}, { passive: false });

window.addEventListener('blur', () => {
  activeTouches.clear();
  keys.left = keys.right = keys.jump = keys.fire = false;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
});

function bindMouseBtn(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('mousedown', e => {
    activateAudioOnInteraction();
    keys[key] = true;
    el.classList.add('active');
    e.preventDefault();
  });
  el.addEventListener('mouseup', e => {
    keys[key] = false;
    el.classList.remove('active');
    e.preventDefault();
  });
  el.addEventListener('mouseleave', () => {
    keys[key] = false;
    el.classList.remove('active');
  });
}

bindMouseBtn('left', 'left');
bindMouseBtn('right', 'right');
bindMouseBtn('jump', 'jump');
bindMouseBtn('fire', 'fire');

loop();
