<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mario Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { user-select: none; -webkit-tap-highlight-color: transparent; }
  body { 
    margin:0; 
    background:#5c94fc; 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    height:100vh; 
    font-family:sans-serif; 
    overflow:hidden;
    touch-action:none;
  }
  canvas { 
    background:#5c94fc; 
    border:4px solid #000; 
    max-width:100%; 
    touch-action:none;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
  }
  
  #controls { 
    position:absolute; 
    bottom:20px; 
    width:100%; 
    display:flex; 
    justify-content:space-between; 
    align-items:flex-end;
    padding:0 15px; 
    box-sizing:border-box;
    pointer-events:none;
  }
  
  .btn { 
    width:80px; 
    height:80px; 
    background:rgba(255,255,255,0.25); 
    color:#fff; 
    border:3px solid rgba(255,255,255,0.6);
    border-radius:50%; 
    font-size:36px; 
    user-select:none;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:auto;
    transition: all 0.1s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
  }
  
  .btn.active {
    background:rgba(229, 37, 33, 0.8);
    border-color:#fff;
    transform: scale(0.92);
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
  }
  
  .btn-jump {
    width:90px;
    height:90px;
    background:rgba(229, 37, 33, 0.5);
    border-color:rgba(255,255,255,0.8);
    font-size:40px;
  }
  
  .btn-jump.active {
    background:rgba(229, 37, 33, 1);
  }
  
  #pauseBtn {
    position:absolute;
    top:80px;
    right:15px;
    width:50px;
    height:50px;
    background:rgba(0,0,0,0.4);
    color:#fff;
    border:2px solid rgba(255,255,255,0.6);
    border-radius:50%;
    font-size:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    backdrop-filter: blur(5px);
    z-index:200;
  }
  
  #pauseBtn.active {
    background:rgba(229, 37, 33, 0.8);
  }
  
  #overlay { 
    position:absolute; 
    top:0; left:0; 
    width:100%; height:100%; 
    background:rgba(0,0,0,0.75); 
    display:none; 
    justify-content:center; 
    align-items:center; 
    flex-direction:column; 
    color:#fff; 
    text-align:center;
    z-index:100;
  }
  #overlay h1 { 
    font-size:48px; 
    margin:10px; 
    text-shadow:3px 3px 0 #000; 
  }
  #overlay p { 
    font-size:24px; 
    margin:10px; 
  }
  #restartBtn { 
    padding:15px 40px; 
    font-size:24px; 
    background:#e52521; 
    color:#fff; 
    border:none; 
    border-radius:10px; 
    cursor:pointer; 
    margin-top:20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  #restartBtn:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="500"></canvas>

<div id="pauseBtn">⏸</div>

<div id="controls">
  <button class="btn" id="left">◀</button>
  <button class="btn btn-jump" id="jump">▲</button>
  <button class="btn" id="right">▶</button>
</div>

<div id="overlay">
  <h1 id="overlayTitle">Game Over</h1>
  <p id="overlayText">Очки: 0</p>
  <button id="restartBtn">Играть снова</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

const keys = { left:false, right:false, jump:false };

let player = { x:50, y:300, w:30, h:40, vx:0, vy:0, onGround:false };

let score = 0;
let lives = 3;
let invincible = 0;
let gameOver = false;
let won = false;
let paused = false;

const platforms = [
  {x:0, y:460, w:400, h:40},
  {x:100, y:380, w:80, h:15},
  {x:220, y:320, w:80, h:15},
  {x:50, y:250, w:80, h:15},
  {x:250, y:200, w:100, h:15},
  {x:150, y:130, w:80, h:15},
];

let coins = [];
let enemies = [];

function initLevel() {
  coins = [
    {x:130, y:350, taken:false},
    {x:250, y:290, taken:false},
    {x:80, y:220, taken:false},
    {x:290, y:170, taken:false},
    {x:180, y:100, taken:false},
  ];
  enemies = [
    {x:50, y:440, w:25, h:20, vx:1, minX:0, maxX:375, alive:true},
    {x:230, y:300, w:25, h:20, vx:-1, minX:220, maxX:295, alive:true},
  ];
}
initLevel();

function vibrate(style) {
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      if (style === 'light') window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      else if (style === 'heavy') window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
      else if (style === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      else if (style === 'error') window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
    } catch(e) {}
  }
}

function drawMario() {
  if (invincible > 0 && Math.floor(invincible / 5) % 2 === 0) return;

  ctx.fillStyle = '#e52521';
  ctx.fillRect(player.x, player.y, player.w, 12);
  ctx.fillStyle = '#fcb89c';
  ctx.fillRect(player.x+5, player.y+12, 20, 12);
  ctx.fillStyle = '#1f5fd6';
  ctx.fillRect(player.x+3, player.y+24, 24, 16);
  ctx.fillStyle = '#000';
  ctx.fillRect(player.x+8, player.y+20, 14, 3);
}

function drawHearts() {
  for (let i = 0; i < 3; i++) {
    const x = 15 + i * 30;
    const y = 15;
    if (i < lives) {
      ctx.fillStyle = '#e52521';
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 6, 0, Math.PI * 2);
      ctx.arc(x + 15, y + 5, 6, 0, Math.PI * 2);
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 10, y + 20);
      ctx.lineTo(x + 20, y + 8);
      ctx.fill();
    } else {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 6, 0, Math.PI * 2);
      ctx.arc(x + 15, y + 5, 6, 0, Math.PI * 2);
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 10, y + 20);
      ctx.lineTo(x + 20, y + 8);
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('Очки: ' + score, 15, 55);
}

function drawPlatform(p) {
  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#fca044';
  ctx.fillRect(p.x, p.y, p.w, 4);
}

function drawCoin(c) {
  if (c.taken) return;
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(c.x, c.y, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#b8860b';
  ctx.fillRect(c.x-1, c.y-5, 2, 10);
}

function drawEnemy(e) {
  if (!e.alive) return;
  ctx.fillStyle = '#6b3410';
  ctx.fillRect(e.x, e.y, e.w, e.h);
  ctx.fillStyle = '#000';
  ctx.fillRect(e.x+5, e.y+5, 4, 4);
  ctx.fillRect(e.x+16, e.y+5, 4, 4);
}

function update() {
  if (gameOver || won || paused) return;

  if (keys.left) player.vx = -3;
  else if (keys.right) player.vx = 3;
  else player.vx = 0;

  if (keys.jump && player.onGround) {
    player.vy = -10;
    player.onGround = false;
    vibrate('light');
  }

  player.vy += 0.5;
  player.x += player.vx;
  player.y += player.vy;

  if (invincible > 0) invincible--;

  player.onGround = false;
  for (const p of platforms) {
    if (player.x < p.x + p.w && player.x + player.w > p.x &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 &&
        player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
  
  if (player.y > canvas.height) {
    hurtPlayer();
    return;
  }

  for (const c of coins) {
    if (!c.taken && Math.abs(player.x+15-c.x) < 20 && Math.abs(player.y+20-c.y) < 20) {
      c.taken = true;
      score += 10;
      vibrate('success');
    }
  }

  if (coins.every(c => c.taken)) {
    won = true;
    vibrate('success');
    showOverlay('🎉 Победа!', 'Ты собрал все монетки! Очки: ' + score);
    return;
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;

    if (player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      if (player.vy > 0 && player.y + player.h < e.y + e.h/2 + 5) {
        e.alive = false;
        player.vy = -7;
        score += 50;
        vibrate('success');
      } else if (invincible === 0) {
        hurtPlayer();
        return;
      }
    }
  }
}

function hurtPlayer() {
  lives--;
  vibrate('error');
  if (lives <= 0) {
    gameOver = true;
    showOverlay('💀 Game Over', 'Твой счёт: ' + score);
  } else {
    invincible = 120;
    player.x = 50;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
  }
}

function showOverlay(title, text, showRestart = true) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  restartBtn.style.display = showRestart ? 'block' : 'none';
  overlay.style.display = 'flex';
}

function restart() {
  score = 0;
  lives = 3;
  invincible = 0;
  gameOver = false;
  won = false;
  paused = false;
  pauseBtn.textContent = '⏸';
  pauseBtn.classList.remove('active');
  player = { x:50, y:300, w:30, h:40, vx:0, vy:0, onGround:false };
  initLevel();
  overlay.style.display = 'none';
}
restartBtn.addEventListener('click', restart);

pauseBtn.addEventListener('click', () => {
  if (gameOver || won) return;
  paused = !paused;
  if (paused) {
    pauseBtn.textContent = '▶';
    pauseBtn.classList.add('active');
    showOverlay('⏸ Пауза', 'Нажми ▶ чтобы продолжить', false);
  } else {
    pauseBtn.textContent = '⏸';
    pauseBtn.classList.remove('active');
    overlay.style.display = 'none';
  }
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(80, 60, 20, 0, Math.PI*2); ctx.arc(100, 60, 25, 0, Math.PI*2); ctx.arc(120, 60, 20, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(300, 90, 18, 0, Math.PI*2); ctx.arc(320, 90, 22, 0, Math.PI*2); ctx.fill();

  platforms.forEach(drawPlatform);
  coins.forEach(drawCoin);
  enemies.forEach(drawEnemy);
  drawMario();
  drawHearts();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = true;
  if (e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З') pauseBtn.click();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
});

// УЛУЧШЕННОЕ УПРАВЛЕНИЕ ДЛЯ ТЕЛЕФОНА
function bindBtn(id, key) {
  const el = document.getElementById(id);
  
  const activate = (e) => {
    e.preventDefault();
    keys[key] = true;
    el.classList.add('active');
  };
  
  const deactivate = (e) => {
    e.preventDefault();
    keys[key] = false;
    el.classList.remove('active');
  };
  
  // Проверяем, находится ли точка внутри элемента
  const isInside = (touch) => {
    const rect = el.getBoundingClientRect();
    return touch.clientX >= rect.left && touch.clientX <= rect.right &&
           touch.clientY >= rect.top && touch.clientY <= rect.bottom;
  };
  
  el.addEventListener('touchstart', activate, {passive: false});
  el.addEventListener('touchend', deactivate, {passive: false});
  el.addEventListener('touchcancel', deactivate, {passive: false});
  
  // ВАЖНО: при движении пальца проверяем, на какой кнопке он находится
  el.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    if (!isInside(touch)) {
      // Палец ушёл за пределы кнопки — отпускаем
      keys[key] = false;
      el.classList.remove('active');
    } else {
      // Палец вернулся — нажимаем снова
      keys[key] = true;
      el.classList.add('active');
    }
  }, {passive: false});
  
  el.addEventListener('mousedown', activate);
  el.addEventListener('mouseup', deactivate);
  el.addEventListener('mouseleave', deactivate);
}

bindBtn('left', 'left');
bindBtn('right', 'right');
bindBtn('jump', 'jump');

// Глобальный обработчик: если все пальцы убраны — сбрасываем все кнопки
document.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    keys.left = false;
    keys.right = false;
    keys.jump = false;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  }
});

loop();
</script>
</body>
</html>
